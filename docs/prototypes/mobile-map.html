<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; font-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Ray: אב־טיפוס למפת הקהילה</title>
  <style>
    :root { --ink:#20353c; --muted:#596b70; --blue:#2466cf; --blue-soft:#eaf1ff; --line:#dce3e1; --paper:#fff; --green:#256c55; --red:#a94434; --shadow:0 8px 32px #20353c14; }
    * { box-sizing:border-box; }
    body { margin:0; background:#eff2ed; color:var(--ink); font:16px/1.55 system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
    button,input,select,textarea { font:inherit; color:inherit; }
    button,a,input,select,textarea,summary { -webkit-tap-highlight-color:transparent; scroll-margin-block:16px; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.65; }
    :focus-visible { outline:3px solid #124db0; outline-offset:4px; }
    [hidden] { display:none !important; }
    bdi { overflow-wrap:anywhere; }
    h1,h2,h3,p { margin:0; }
    h1 { font-size:18px; letter-spacing:-.3px; }
    h2 { font-size:23px; line-height:1.35; letter-spacing:-.5px; }
    h3 { font-size:17px; }
    svg { display:block; flex-shrink:0; }
    .icon { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .sr-only { position:absolute; width:1px; height:1px; margin:-1px; padding:0; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
    .skip { position:fixed; inset-block-start:8px; inset-inline-start:8px; z-index:50; transform:translateY(-160%); padding:12px; background:white; color:var(--blue); border-radius:12px; }
    .skip:focus { transform:none; }
    .app { width:100%; max-width:1280px; height:100vh; height:100svh; min-height:620px; margin:auto; display:flex; flex-direction:column; background:var(--paper); box-shadow:0 0 60px #20353c0c; }
    .prototype-notice { flex-shrink:0; padding:4px 12px; background:#f7ebcf; color:#64502c; font-size:12px; text-align:center; font-weight:650; }
    .header { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:8px; border:0; padding:0; background:none; min-height:44px; text-align:start; }
    .brand-mark { width:36px; height:36px; border-radius:12px; display:grid; place-items:center; color:var(--blue); background:var(--blue-soft); }
    .wordmark { display:block; font-size:28px; font-weight:850; letter-spacing:-1.4px; line-height:1; }
    .tagline { display:block; margin-top:4px; font-size:11px; color:var(--muted); }
    .demo-button { min-height:44px; padding:8px 10px; border:1px solid var(--line); border-radius:30px; background:white; display:flex; align-items:center; gap:6px; font-size:12px; font-weight:650; }
    .demo-dot { width:7px; height:7px; border-radius:50%; background:#87948d; }
    .demo-dot.member { background:var(--blue); }
    .toolbar { padding:12px 16px 10px; display:grid; gap:12px; }
    .toolbar-top,.toolbar-bottom { display:flex; align-items:center; justify-content:space-between; gap:10px; min-width:0; }
    .scope { display:flex; gap:4px; background:#f0f3f5; padding:4px; border-radius:14px; flex:1; min-width:0; }
    .scope button { min-height:44px; flex:1; border:0; border-radius:10px; background:none; padding:7px 8px; font-size:14px; font-weight:650; display:flex; align-items:center; justify-content:center; gap:6px; }
    .scope button[aria-pressed="true"] { background:white; box-shadow:0 1px 6px #18344d10; color:var(--blue); }
    .scope .icon { width:18px; height:18px; }
    .icon-button { min-width:44px; min-height:44px; border:1px solid var(--line); border-radius:12px; background:white; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
    .filter-button { position:relative; }
    .filter-dot { width:8px; height:8px; border-radius:50%; background:var(--blue); position:absolute; top:6px; right:6px; }
    .view-control { display:flex; border:1px solid var(--line); border-radius:10px; padding:2px; }
    .view-control button { display:flex; align-items:center; gap:4px; border:0; background:none; min-height:44px; padding:5px 9px; border-radius:7px; font-size:12px; }
    .view-control button[aria-pressed="true"] { background:var(--blue-soft); color:var(--blue); font-weight:700; }
    .view-control .icon { width:16px; height:16px; }
    .subheading { font-size:12px; color:var(--muted); }
    .workspace { position:relative; flex:1; min-height:0; background:#e9edde; border-block:1px solid #d5decf; isolation:isolate; }
    .map-pane { position:absolute; inset:0; overflow:hidden; }
    .map-pane:focus-visible { outline-offset:-5px; }
    .map-world { position:absolute; inset:0; transform-origin:50% 45%; }
    .cartography { position:absolute; width:100%; height:100%; }
    .map-label { font:500 13px system-ui,sans-serif; fill:#61785c; }
    .map-caption { position:absolute; top:12px; right:12px; max-width:calc(100% - 76px); padding:5px 9px; background:#ffffffed; border:1px solid #d6dfd1; border-radius:9px; font-size:10px; color:#455a4b; pointer-events:none; }
    .map-tools { position:absolute; top:12px; left:12px; display:grid; border:1px solid #cdd7c7; border-radius:12px; background:white; box-shadow:0 3px 12px #20353c0b; overflow:hidden; }
    .map-tools button { display:grid; place-items:center; width:44px; height:44px; border:0; background:white; }
    .map-tools button + button { border-top:1px solid var(--line); }
    .marker { position:absolute; left:var(--x); top:var(--y); transform:translate(-50%,-50%); min-width:48px; min-height:48px; padding:7px 9px; border:2px solid white; border-radius:15px 15px 15px 3px; background:white; box-shadow:0 3px 10px #273a3030; display:flex; align-items:center; justify-content:center; gap:5px; color:#374d50; font-size:12px; font-weight:750; z-index:2; }
    .marker.emergency { color:#9c3a2d; background:#fff2e9; }
    .marker.food { color:#705a17; background:#fff7d9; }
    .marker.station { border-radius:50%; color:#37644e; background:#f8fff6; min-width:56px; min-height:56px; flex-direction:column; gap:0; font-size:10px; }
    .marker.inactive { border:2px dashed #84928a; background:#f3f3ef; color:#53605b; }
    .marker[aria-pressed="true"] { outline:3px solid var(--blue); outline-offset:5px; box-shadow:0 0 0 8px #ffffffc2,0 5px 16px #20353c35; z-index:4; }
    .marker .icon { width:21px; height:21px; }
    .legend { position:absolute; bottom:14px; right:14px; background:#ffffffed; border-radius:10px; padding:7px 10px; color:#4f6054; font-size:11px; pointer-events:none; }
    .selection-open .legend { display:none; }
    .scene-panel { position:absolute; inset:70px 16px auto; max-width:380px; margin-inline:auto; border:1px solid var(--line); padding:20px; border-radius:20px; background:#fffffffa; box-shadow:var(--shadow); text-align:center; }
    .scene-panel p { color:var(--muted); margin:8px 0 14px; font-size:14px; }
    .scene-panel h2 { font-size:19px; }
    .scene-panel .icon { margin:0 auto 8px; width:28px; height:28px; color:var(--blue); }
    .skeleton { height:10px; background:#e9edf0; border-radius:6px; margin:12px auto; width:85%; }
    .skeleton.short { width:55%; }
    .list-pane { position:absolute; inset:0; background:#f6f8f5; overflow:auto; padding:16px; overscroll-behavior:contain; }
    .results-list { list-style:none; margin:0 auto; padding:0; display:grid; gap:10px; max-width:700px; }
    .list-item { width:100%; display:flex; align-items:center; gap:12px; border:1px solid var(--line); background:white; padding:14px; border-radius:16px; text-align:start; min-height:90px; }
    .list-icon { background:#edf2fa; color:var(--blue); width:44px; height:44px; display:grid; place-items:center; border-radius:13px; flex-shrink:0; }
    .list-content { min-width:0; flex:1; }
    .list-content strong { display:block; font-size:16px; margin:4px 0; }
    .list-content small { color:var(--muted); font-size:12px; }
    .list-pane.selection-open { padding-bottom:260px; }
    .compact { position:absolute; z-index:6; bottom:12px; right:12px; left:12px; max-width:440px; padding:16px; background:white; border:1px solid #d6dfdf; border-radius:22px; box-shadow:0 10px 40px #1b303322; }
    .compact-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:7px; }
    .compact .icon-button { border:0; background:#f2f5f4; min-width:44px; min-height:44px; }
    .badges { display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0; }
    .badge { display:inline-flex; align-items:center; gap:4px; padding:3px 8px; border-radius:7px; font-size:11px; font-weight:650; background:#f0f3f3; }
    .badge.need { color:#98402d; background:#fff0e7; }
    .badge.active { color:#255b45; background:#e9f4ea; }
    .badge.progress { color:#785719; background:#fff4d8; }
    .compact h2 { font-size:19px; }
    .compact-desc { color:#53656b; font-size:13px; margin:6px 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .updated { display:block; font-size:11px; color:#65757b; margin:8px 0; }
    .compact-footer { display:flex; align-items:center; gap:12px; justify-content:space-between; margin-top:10px; }
    .compact-footer small { color:var(--muted); font-size:11px; }
    .button { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; border:1px solid var(--line); border-radius:12px; padding:10px 15px; background:white; font-weight:650; font-size:14px; text-align:center; }
    .button.primary { color:white; background:var(--blue); border-color:var(--blue); }
    .button.soft { color:#174c9d; border-color:#cedcf3; background:#f0f5ff; }
    .button.wide { width:100%; }
    .button.link-like { border:0; color:var(--blue); background:none; text-decoration:underline; padding-inline:4px; }
    .bottom-bar { flex-shrink:0; padding:10px 16px max(10px,env(safe-area-inset-bottom)); background:white; display:grid; gap:4px; }
    .care-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .care-actions .button { min-width:0; min-height:48px; border-radius:14px; padding-inline:8px; box-shadow:0 3px 9px #2466cf22; }
    .welfare-link { min-height:44px; border:0; background:none; color:#245694; font-size:12px; text-decoration:underline; }
    .welfare-card { padding:16px; border:1px solid var(--line); border-radius:16px; }
    .welfare-card p { margin:8px 0 12px; font-size:14px; }
    .future-badge { display:inline-block; margin-bottom:8px; padding:4px 8px; border-radius:7px; background:#f1eaf9; color:#62447e; font-size:12px; font-weight:700; }
    .live-message { flex-shrink:0; padding:5px 16px; color:#30593f; background:#edf6eb; font-size:12px; border-top:1px solid #dce8d9; }
    dialog { color:var(--ink); border:0; padding:0; width:calc(100% - 16px); max-width:560px; max-height:calc(100vh - 24px); max-height:calc(100dvh - 24px); margin:auto auto 8px; border-radius:26px; box-shadow:0 20px 100px #152b3a44; overflow:hidden; }
    dialog::backdrop { background:#172f3a70; }
    .sheet { display:flex; flex-direction:column; max-height:calc(100vh - 24px); max-height:calc(100dvh - 24px); }
    .sheet-header { padding:16px 20px 12px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-shrink:0; }
    .eyebrow { display:block; color:var(--muted); font-size:11px; margin-bottom:7px; }
    .sheet-header h2 { font-size:22px; }
    .sheet-scroll { padding:18px 20px; overflow:auto; overscroll-behavior:contain; min-height:0; }
    .sheet-scroll > * + * { margin-top:18px; }
    .sheet-footer { padding:12px 20px max(14px,env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:#fff; flex-shrink:0; }
    .sheet-footer p { margin-bottom:8px; }
    .sheet-copy { font-size:15px; line-height:1.8; overflow-wrap:anywhere; }
    .muted { color:var(--muted); font-size:13px; }
    .image-placeholder { min-height:130px; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:8px; padding:18px; border-radius:16px; background:linear-gradient(135deg,#eef3e7,#e0ebeb); color:#5c7569; text-align:center; font-size:12px; }
    .image-placeholder .icon { width:46px; height:46px; stroke-width:1.25; }
    .image-unavailable { background:#f4f5f3; color:var(--muted); }
    .location-box { display:flex; gap:12px; padding:14px; border:1px solid var(--line); border-radius:14px; }
    .location-box .icon { color:var(--blue); }
    .location-box strong,.location-box small { display:block; }
    .summary-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:12px 0 0; }
    .summary-grid > div { padding:14px 12px; border:1px solid #dce7db; border-radius:15px; background:#f6faf3; }
    .summary-grid dt { color:#4c6655; font-size:12px; display:flex; gap:5px; align-items:center; margin-bottom:5px; }
    .summary-grid dd { margin:0; font-weight:700; font-size:17px; }
    .summary-grid .icon { width:18px; height:18px; }
    .hint-box { background:#f3f6f9; border-radius:12px; padding:12px; color:#50626c; font-size:13px; }
    .inactive-note { background:#f8f0df; color:#725620; border-radius:12px; padding:12px; font-size:14px; }
    details { border:1px solid var(--line); border-radius:14px; padding:2px 14px; }
    summary { cursor:pointer; min-height:48px; padding-block:12px; font-weight:650; font-size:14px; }
    .history { list-style:none; padding:0; margin:0; }
    .history li { padding:12px 0; border-top:1px solid var(--line); font-size:13px; }
    .history strong,.history time { display:block; }
    .history time { color:var(--muted); font-size:12px; }
    .history p { overflow-wrap:anywhere; }
    .field { display:grid; gap:6px; }
    .field > label,.field legend { font-size:14px; font-weight:650; }
    select,textarea,input[type="text"] { width:100%; min-width:0; min-height:46px; padding:11px; background:white; border:1px solid #bdc9cf; border-radius:10px; }
    textarea { resize:vertical; min-height:100px; }
    fieldset { min-width:0; border:0; padding:0; margin:0; }
    .choices { display:flex; flex-wrap:wrap; gap:8px; }
    .choice { display:flex; gap:8px; align-items:center; padding:12px; min-height:48px; border:1px solid var(--line); border-radius:12px; flex:1; }
    input[type="checkbox"] { width:20px; height:20px; accent-color:var(--blue); }
    .form-message { padding:12px; border-radius:10px; font-size:14px; }
    .form-message--success { background:#eef5ec; color:#315c38; }
    .form-message--error { color:#903b2e; background:#fff0e9; }
    .inline-actions { display:flex; gap:8px; flex-wrap:wrap; }
    .inline-actions > * { flex:1; }
    .section-rule { padding-top:16px; border-top:1px solid var(--line); }
    @media(min-width:760px) {
      .app { padding-inline:20px; }
      .prototype-notice { margin-inline:-20px; }
      .header { padding:14px 6px; }
      .tagline { font-size:12px; }
      .toolbar { display:flex; justify-content:space-between; align-items:center; padding:16px 6px; }
      .toolbar-top { min-width:360px; }
      .toolbar-bottom { min-width:300px; }
      .workspace { border-radius:22px; border:1px solid #d5decf; }
      .compact { bottom:20px; right:20px; left:auto; width:420px; }
      .bottom-bar { padding-inline:6px; }
      dialog { margin:auto; }
      .marker { font-size:13px; }
    }
    @media(max-width:350px) {
      .header,.toolbar,.bottom-bar { padding-inline:12px; }
      .tagline { font-size:10px; }
      .demo-button { font-size:11px; padding-inline:8px; }
      .scope button { font-size:12px; padding-inline:5px; }
      .compact { padding:12px; }
      .compact h2 { font-size:18px; }
      .sheet-header,.sheet-scroll,.sheet-footer { padding-inline:16px; }
      .summary-grid dd { font-size:15px; }
      .care-actions { gap:8px; }
      .care-actions .button { font-size:12px; }
    }
    @media(max-height:620px) { .app { height:auto; min-height:100svh; } .workspace { flex:none; min-height:380px; } }
    @media(prefers-reduced-motion:no-preference) { button { transition:background-color .15s,box-shadow .15s; } }
  </style>
</head>

  <svg width="0" height="0" aria-hidden="true" style="position:absolute"><defs>
    <symbol id="i-cat" viewBox="0 0 24 24"><path d="m5 10-1-7 6 4h4l6-4-1 7c4 9-1 11-7 11S2 19 5 10Z"/><path d="M8 13h.01M16 13h.01M10 16l2 1 2-1M3 15l4 1M17 16l4-1"/></symbol>

    <symbol id="i-alert" viewBox="0 0 24 24"><path d="m12 3 10 18H2L12 3Z"/><path d="M12 9v5M12 17h.01"/></symbol>

    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2s-7 8-7 13a7 7 0 0 0 14 0c0-5-7-13-7-13Z"/><path d="M9 15c0 2 1 3 3 3"/></symbol>

    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>

  </defs></svg>
  <a class="skip" href="#workspace">דילוג למפה ולרשימה</a>
  <main class="app" id="app">
    <div class="prototype-notice">אב־טיפוס: נתונים סינתטיים</div>
    <header class="header">
      <button class="brand" type="button" data-action="home" aria-label="Ray: חזרה למפה">
        <span class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-cat"/></svg></span>
        <span><bdi class="wordmark" dir="ltr">Ray</bdi><span class="tagline">בשביל חתולי הקהילה</span></span>
      </button>
      <button class="demo-button" id="demo-button" type="button" data-action="demo" aria-haspopup="dialog"><span class="demo-dot" id="demo-dot"></span><span id="actor-label">הדגמה: אורח</span><span aria-hidden="true">⌄</span></button>
    </header>
    <nav class="toolbar" aria-label="תצוגת מפת הקהילה">
      <div class="toolbar-top">
        <div class="scope" role="group" aria-label="מה להציג">
          <button id="scope-all" type="button" data-action="scope" data-value="all" aria-pressed="true">הכול</button>
          <button id="scope-stations" type="button" data-action="scope" data-value="stations" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-cat"/></svg>תחנות</button>
          <button id="scope-reports" type="button" data-action="scope" data-value="reports" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg>דיווחים</button>
        </div>
        <button class="icon-button filter-button" id="filter-button" type="button" data-action="filters" aria-label="פתיחת סינון" aria-haspopup="dialog"><svg class="icon" aria-hidden="true"><use href="#i-filter"/></svg><span class="filter-dot" id="filter-dot" hidden></span></button>
      </div>
      <div class="toolbar-bottom">
        <div><h1 id="page-heading">מפת רווחת החתולים</h1><p class="subheading" id="results-count">דיווחים ציבוריים; תחנות אחרי התחברות</p></div>
        <div class="view-control" role="group" aria-label="אופן התצוגה">
          <button id="view-map" type="button" data-action="view" data-value="map" aria-pressed="true"><svg class="icon" aria-hidden="true"><use href="#i-map"/></svg>מפה</button>
          <button id="view-list" type="button" data-action="view" data-value="list" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>רשימה</button>
        </div>
      </div>

  <script>
    'use strict';
    // Synthetic, fictional fixtures only. Client-side gating is a demonstration,

      { domain:'report', id:'report-2', type:'general', status:'in-progress', title:'גורים ליד פינת ישיבה', description:'דוגמה בלבד: כמה גורים נמצאים ליד פינת ישיבה דמיונית. טקסט ארוך לבדיקת קריאות: חתולי הקהילה נעזרים בתשומת לב משותפת, ובתיאור ברור אפשר להבין מה נראה במקום. Mixed text: Kitten Кот 42: כל התוכן סינתטי.', place:'פינת הישיבה הדמיונית', x:34, y:57, updated:'2026-11-05T09:20:00+02:00', assignee:'member-a' },
      { domain:'report', id:'report-3', type:'food', status:'resolved', title:'עדכון מזון לדוגמה', description:'דיווח מזון ציבורי סינתטי. זהו דיווח כללי במערכת, ולא רשומת האכלה בתחנה. המצב ״טופל״ מתאר סימון בחשבון, לא תוצאה רפואית מאומתת.', place:'השביל הדרומי הדמיוני', x:59, y:79, updated:'2026-11-04T17:00:00+02:00', assignee:'member-b' }
    ];

    const futureExamples = {
      kittens:{title:'סיוע ייעודי לגורים: דוגמה עתידית',example:'דוגמת עתיד: ריכוז תצפיות ומעקב ייעודי אחר צרכים של גורים לאורך זמן.',boundary:'כיום אפשר לתאר גורים בדיווח כללי או דחוף. קטגוריה ייעודית ותהליך תיאום טיפול בגורים עדיין אינם קיימים ביישום.'},
      sterilization:{title:'צורך בעיקור או בסירוס: דוגמה עתידית',example:'דוגמת עתיד: ציון צורך בעיקור או בסירוס ומעקב אחר בקשת סיוע בהמשך.',boundary:'קטגוריה ותהליך ייעודיים לעיקור ולסירוס אינם קיימים ביישום. אין כאן הזמנת טיפול, תיאום לכידה או התחייבות של נותן שירות.'},
      coordination:{title:'תיאום עם גורמי סיוע: דוגמה עתידית',example:'דוגמת עתיד: בקשת תיאום המשך טיפול והצגת מצב פנייה לגורם מסייע, אם יפותח תהליך כזה.',boundary:'אין ביישום תהליך עבודה עם נותני טיפול, חשבונות עירוניים או אישור קבלה מגורם מקצועי. לקיחה לטיפול וסימון כטופל כיום הם פעולות חשבון בדיווח, ללא אימות רפואי.'}
    };
    const state = { actor:'guest', epoch:0, scope:'all', view:'map', selected:null, opener:null, scene:'ready', details:'ready', media:'placeholder', filter:'all', stationFilter:'all', status:'all', futureExample:null, camera:{x:0,y:0,zoom:1}, reports:seedReports.map(r=>({...r})), ownLog:[], feedingDraft:{food:true,water:true,note:''} };
    const $ = id => document.getElementById(id);
    const icon = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dateText = value => new Intl.DateTimeFormat('he-IL',{dateStyle:'short',timeStyle:'short',timeZone:'Asia/Jerusalem'}).format(new Date(value));
    const member = () => state.actor !== 'guest';
    const currentItem = () => state.selected && [...state.reports,...(member()?stations:[])].find(r=>r.id===state.selected);
    let dialogKind = null, returnFocus = null;

    function announce(message) { $('announcer').textContent=message; $('live-message').textContent=message; $('live-message').hidden=!message; }
    function focus(id) { const target=$(id); if (target && !target.closest('[hidden]')) target.focus(); else $(`view-${state.view}`).focus(); }
    function visibleItems() {
      const reports=state.scope==='stations'?[]:state.reports.filter(r=>(state.filter==='all'||r.type===state.filter)&&(state.status==='all'||r.status===state.status));
      const care=state.scope==='reports'||!member()?[]:stations.filter(s=>state.stationFilter==='all'||(state.stationFilter==='active'?s.active:!s.active));
      // Schematic top-to-bottom order, never a domain priority or real distance.
      return [...reports,...care].sort((a,b)=>a.y-b.y);
    }
    function itemBadge(item) { return item.domain==='station' ? `<span class="badge">תחנת האכלה</span><span class="badge ${item.active?'active':''}">${item.active?'פעילה':'לא פעילה'}</span>` : `<span class="badge need">דיווח · ${typeText[item.type]}</span><span class="badge ${item.status==='in-progress'?'progress':''}">${statusText[item.status]}</span>`; }
    function itemIcon(item) { return item.domain==='station'?'cat':item.type==='emergency'?'alert':item.type==='food'?'bowl':'pin'; }
    function camera() { $('map-world').style.transform=`translate(${state.camera.x}px,${state.camera.y}px) scale(${state.camera.zoom})`; }
    function resetSelection() { state.selected=null; state.opener=null; $('compact').replaceChildren(); $('compact').hidden=true; }

    function render() {
      const items=visibleItems(), blocked=state.scope==='stations'&&!member(), ready=state.scene==='ready'&&!blocked;
      $('actor-label').textContent=`הדגמה: ${actorText[state.actor]}`;
      $('demo-dot').className=`demo-dot${member()?' member':''}`;
      for(const name of ['all','stations','reports']) $(`scope-${name}`).setAttribute('aria-pressed',String(state.scope===name));
      for(const name of ['map','list']) $(`view-${name}`).setAttribute('aria-pressed',String(state.view===name));
      $('filter-dot').hidden=state.filter==='all'&&state.status==='all'&&state.stationFilter==='all';
      $('results-count').textContent=blocked?'תחנות זמינות לאחר התחברות':state.scene==='loading'?'טוענים תצוגת הדגמה…':state.scene==='error'?'שגיאה מדומה: אפשר לנסות שוב':state.scope==='all'&&!member()?'דיווחים ציבוריים; תחנות אחרי התחברות':`${state.scene==='empty'?0:items.length} ${state.scope==='all'?'דוגמאות: תחנות ודיווחים':state.scope==='reports'?'דיווחים לדוגמה':'תחנות לדוגמה'}`;
      $('map-pane').hidden=state.view!=='map'; $('list-pane').hidden=state.view!=='list';
      $('markers').innerHTML=ready?items.map(item=>`<button type="button" class="marker ${item.domain==='station'?'station '+(!item.active?'inactive':''):item.type}" id="marker-${item.id}" style="--x:${item.x}%;--y:${item.y}%" data-action="select" data-id="${item.id}" aria-pressed="${state.selected===item.id}" aria-label="${escapeHTML((item.domain==='station'?'תחנת האכלה, ':'דיווח '+typeText[item.type]+', ')+item.title+', '+(item.domain==='station'?(item.active?'פעילה':'לא פעילה'):statusText[item.status]))}">${icon(itemIcon(item))}<span>${item.domain==='station'?(item.active?'תחנה':'לא פעילה'):typeText[item.type]}</span></button>`).join(''):'';
      $('results-list').innerHTML=ready?items.map(item=>`<li><button type="button" class="list-item" id="list-${item.id}" data-action="select" data-id="${item.id}"><span class="list-icon">${icon(itemIcon(item))}</span><span class="list-content"><span class="badges">${itemBadge(item)}</span><strong dir="auto">${escapeHTML(item.title)}</strong><small>${item.domain==='report'?'עדכון אחרון שנרשם: '+dateText(item.updated):'מידע סינתטי לתיאום האכלה'}</small></span>${icon('arrow')}</button></li>`).join(''):'';
      const panel=$('scene-panel'); panel.hidden=true;
      if(blocked) { panel.hidden=false; panel.innerHTML=`${icon('lock')}<h2>תחנות האכלה זמינות אחרי התחברות</h2><p>דיווחים ציבוריים פתוחים לכולם. כאן אפשר לעבור לחשבון הדגמה כדי לראות תחנות.</p><button type="button" class="button primary" data-action="demo">בחירת חשבון הדגמה</button>`; }
      else if(state.scene==='loading') { panel.hidden=false; panel.innerHTML='<h2>טוענים את תצוגת ההדגמה</h2><p role="status">דוגמה למצב טעינה, ללא חיבור לשרת.</p><div class="skeleton"></div><div class="skeleton short"></div><button type="button" class="button soft" data-action="ready">סיום טעינה בהדגמה</button>'; }
      else if(state.scene==='error') { panel.hidden=false; panel.innerHTML='<h2>התצוגה לא נטענה</h2><p role="alert">שגיאה מדומה. הבחירה בסינון נשמרה ואפשר לנסות שוב.</p><button type="button" class="button primary" data-action="ready">ניסיון נוסף בהדגמה</button>'; }
      else if(state.scene==='empty'||!items.length) { panel.hidden=false; panel.innerHTML='<h2>אין פריטים בתצוגה הזו</h2><p>אפשר להסיר את הסינון או לחזור לנתוני ההדגמה.</p><button type="button" class="button soft" data-action="clear-filters">הצגת כל הדוגמאות</button>'; }
      if(!ready||!items.some(r=>r.id===state.selected)) resetSelection();
      renderCompact(); camera();
      $('map-pane').classList.toggle('selection-open',!!state.selected);
      $('list-pane').classList.toggle('selection-open',!!state.selected);
    }
    function renderCompact() {
      const item=currentItem(), card=$('compact'); card.hidden=!item;
      if(!item) { card.replaceChildren(); return; }
      const station=item.domain==='station';
      const summary=station?`מזון: ${item.food} · מים: ${item.water}${item.active?'':' · התחנה אינה פעילה; צפייה בלבד.'}`:item.description;
      card.innerHTML=`<div class="compact-top"><div class="badges">${itemBadge(item)}</div><button type="button" class="icon-button" data-action="close-card" aria-label="סגירת כרטיס וחזרה לפריט שנבחר">${icon('close')}</button></div><h2 id="compact-title" tabindex="-1" dir="auto">${escapeHTML(item.title)}</h2><p class="compact-desc" dir="auto">${escapeHTML(summary)}</p>${station?'':`<time class="updated" datetime="${item.updated}">עדכון אחרון שנרשם: <bdi>${dateText(item.updated)}</bdi></time>`}<div class="compact-footer"><small>דוגמה סינתטית בלבד</small><button type="button" class="button soft" id="expand-current" data-action="expand" aria-haspopup="dialog">${station?'פרטי התחנה':'לפרטים המלאים'}${icon('arrow')}</button></div>`;
    }
    function finishOverlay() { const opener=returnFocus; $('overlay').replaceChildren(); dialogKind=null; returnFocus=null; focus(opener||'demo-button'); }
    function closeOverlay() { if($('overlay').open) { $('overlay').close(); finishOverlay(); } }
    function sheet(title,body,footer='') { return `<div class="sheet"><header class="sheet-header"><div><span class="eyebrow">אב־טיפוס: נתונים סינתטיים</span><h2 id="dialog-title" tabindex="-1">${title}</h2></div><button type="button" class="icon-button" data-action="close-overlay" aria-label="סגירה וחזרה לתצוגה הקודמת">${icon('close')}</button></header><p class="sr-only" id="dialog-announcer" role="status" aria-live="polite" aria-atomic="true"></p><p class="sr-only" id="dialog-alert" role="alert" aria-atomic="true"></p><div class="sheet-scroll">${body}</div>${footer?`<footer class="sheet-footer">${footer}</footer>`:''}</div>`; }
    function openOverlay(kind,opener) {
      if((kind==='detail'||kind==='feed')&&!currentItem()) return;
      if(kind==='feed'&&(!member()||currentItem().domain!=='station'||!currentItem().active)) return;
      if(typeof $('overlay').showModal!=='function') { announce('התצוגה המורחבת דורשת דפדפן שתומך בחלונית מודאלית. אפשר להמשיך בכרטיס וברשימה.'); return; }
      dialogKind=kind; returnFocus=opener||document.activeElement?.id||'demo-button';
      renderOverlay(); if(!$('overlay').open) $('overlay').showModal(); focus('dialog-title');
    }
    function imageArea() {
      if(state.media==='empty') return `<div class="image-placeholder image-unavailable">${icon('picture')}<p>לא צורפה תמונה לדוגמה.</p></div>`;
      if(state.media==='loading') return '<div class="image-placeholder"><p role="status">טעינת תמונה לדוגמה…</p><button type="button" class="button" data-action="image-ready">סיום הטעינה בהדגמה</button></div>';
      if(state.media==='unavailable') return `<div class="image-placeholder image-unavailable">${icon('picture')}<p role="status">התמונה אינה זמינה בדוגמה הזו.</p><button type="button" class="button" data-action="image-ready">ניסיון נוסף בהדגמה</button></div>`;

      if(item.domain==='report') return `<div class="badges">${itemBadge(item)}</div>${imageArea()}<p class="sheet-copy" dir="auto">${escapeHTML(item.description)}</p><p class="muted">עדכון אחרון שנרשם: <time datetime="${item.updated}"><bdi>${dateText(item.updated)}</bdi></time> · מועד סינתטי</p>${locationArea(item)}<p class="hint-box">סימון ״טופל״ מציין פעולה של חשבון במערכת, ולא טיפול מקצועי מאומת או אישור שגורם כלשהו קיבל את הדיווח.</p>`;

      }
      if(form.id==='report-form') {
        if(!form.elements.namedItem('description').value.trim()) { feedback('report-message','יש להוסיף תיאור מומצא לצורך ההדגמה.',true); form.elements.namedItem('description').focus(); return; }
        if(!form.dataset.point) { feedback('report-message','יש לבחור נקודת הדגמה ידנית. לא נעשה שימוש ב־GPS.',true); return; }
        feedback('report-message','הודגמה שליחה בלבד. הדיווח לא נשמר, לא נשלח ולא נוסף למפה. הטיוטה נשארה פתוחה.');
      }
    });
    $('map-pane').addEventListener('keydown',event=>{
      if(event.target!==$('map-pane')) return;
      const moves={ArrowLeft:[14,0],ArrowRight:[-14,0],ArrowUp:[0,14],ArrowDown:[0,-14]}; const move=moves[event.key]; if(!move) return;
      event.preventDefault(); state.camera.x=Math.max(-60,Math.min(60,state.camera.x+move[0])); state.camera.y=Math.max(-60,Math.min(60,state.camera.y+move[1])); camera();
    });
    document.addEventListener('keydown',event=>{ if(event.key==='Escape'&&!$('overlay').open&&state.selected) { event.preventDefault(); const opener=state.opener; resetSelection(); render(); focus(opener||`view-${state.view}`); } });
    $('overlay').addEventListener('cancel',event=>{ event.preventDefault(); closeOverlay(); });
    // close events can be queued after another view has opened. Never clear a
    // replacement modal; normal explicit close already disposes synchronously.
    $('overlay').addEventListener('close',()=>{ if(!$('overlay').open&&dialogKind!==null) finishOverlay(); });
    render();
  </script>
</body>
</html>
